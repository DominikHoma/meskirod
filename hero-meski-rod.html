<title>Męski Ród — Krąg Ognia</title>
<style>
  :root{
    --ground:#120d0a;
    --ground-2:#1b1410;
    --ember:#e8912e;
    --ember-bright:#ffb24a;
    --flame-hot:#ffd782;
    --bone:#ece1cc;
    --bone-dim:#a4967f;
    --steel:#7f8d96;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--ground);
    color:var(--bone);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100svh;
    min-height:640px;
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 118%, rgba(232,145,46,0.20) 0%, rgba(232,145,46,0.05) 30%, transparent 55%),
      radial-gradient(140% 120% at 50% -10%, #241a13 0%, var(--ground) 45%, #0b0806 100%);
  }

  /* ---- fire canvas ---- */
  #fire{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    will-change:transform;
  }

  /* ---- drifting mist over the shore ---- */
  .mist{
    position:absolute;
    left:-25%;
    width:150%;
    height:42%;
    top:52%;
    z-index:1;
    filter:blur(46px);
    mix-blend-mode:screen;
    pointer-events:none;
    will-change:transform;
  }
  .mist-a{
    background:radial-gradient(60% 100% at 30% 50%, rgba(127,141,150,0.34), transparent 70%);
    animation:drift-a 34s ease-in-out infinite alternate;
  }
  .mist-b{
    top:60%;
    height:34%;
    background:radial-gradient(55% 100% at 70% 50%, rgba(150,160,168,0.26), transparent 72%);
    animation:drift-b 46s ease-in-out infinite alternate;
  }
  .mist-c{
    top:46%;
    height:30%;
    opacity:.7;
    background:radial-gradient(50% 100% at 50% 50%, rgba(110,124,133,0.22), transparent 70%);
    animation:drift-a 58s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift-a{from{transform:translateX(-4%);}to{transform:translateX(6%);}}
  @keyframes drift-b{from{transform:translateX(5%);}to{transform:translateX(-5%);}}

  /* ---- vignette to hold the eye at the fire ---- */
  .vignette{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    background:
      radial-gradient(115% 90% at 50% 44%, transparent 40%, rgba(8,5,3,0.55) 82%, rgba(6,4,2,0.9) 100%);
  }

  /* ---- top bar ---- */
  .topbar{
    position:absolute;
    top:0;left:0;right:0;
    z-index:6;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:clamp(16px,2.4vw,28px) clamp(18px,4vw,52px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:11px;
    letter-spacing:.34em;
    font-size:13px;
    text-transform:uppercase;
    color:var(--bone);
  }
  .brand svg{width:24px;height:auto;filter:drop-shadow(0 0 6px rgba(232,145,46,.4));}
  .brand b{font-weight:600;}
  .dom{
    font-size:12px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--bone-dim);
  }

  /* ---- hero content ---- */
  .hero{
    position:absolute;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 22px;
    transform:translateZ(0);
    will-change:transform;
  }
  .eyebrow{
    font-size:clamp(10px,1.1vw,13px);
    letter-spacing:.46em;
    text-transform:uppercase;
    color:var(--bone-dim);
    margin-bottom:clamp(20px,3.4vh,38px);
    padding-left:.46em;
    opacity:0;
    animation:rise .9s .15s cubic-bezier(.2,.7,.2,1) forwards;
  }

  .mark{
    margin-bottom:clamp(14px,2.4vh,26px);
    opacity:0;
    animation:rise 1s .3s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .mark svg{
    width:clamp(64px,8vw,92px);
    height:auto;
    filter:drop-shadow(0 0 14px rgba(232,145,46,.45));
  }

  .wordmark{
    margin:0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"URW Palladio L","Book Antiqua",Georgia,serif;
    font-weight:600;
    font-size:clamp(52px,12vw,150px);
    line-height:.94;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-wrap:balance;
    background:linear-gradient(178deg,#f6ecd6 6%,#f2c67d 58%,var(--ember) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 6px 26px rgba(232,145,46,.28));
    opacity:0;
    animation:rise 1.1s .42s cubic-bezier(.2,.7,.2,1) forwards;
  }

  .rule{
    width:0;
    height:1px;
    margin:clamp(20px,3vh,30px) 0 clamp(18px,2.6vh,26px);
    background:linear-gradient(90deg,transparent,rgba(232,145,46,.85),transparent);
    animation:widen 1.2s .8s cubic-bezier(.2,.7,.2,1) forwards;
  }

  .sub{
    margin:0;
    max-width:34ch;
    font-size:clamp(14px,1.7vw,20px);
    line-height:1.5;
    letter-spacing:.02em;
    color:var(--bone);
    opacity:0;
    animation:rise 1s .95s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .lede{
    margin:clamp(12px,1.6vh,16px) 0 0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-style:italic;
    font-size:clamp(15px,1.9vw,22px);
    color:var(--flame-hot);
    letter-spacing:.01em;
    opacity:0;
    animation:rise 1s 1.1s cubic-bezier(.2,.7,.2,1) forwards;
  }

  .cta{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    margin-top:clamp(26px,4vh,42px);
    opacity:0;
    animation:rise 1s 1.28s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:15px 30px;
    font-size:14px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    text-decoration:none;
    border-radius:2px;
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s ease, border-color .25s ease;
  }
  .btn-primary{
    color:#1a120a;
    background:linear-gradient(180deg,var(--ember-bright),var(--ember));
    border:1px solid rgba(255,190,90,.6);
    box-shadow:0 0 0 rgba(232,145,46,0), 0 10px 30px rgba(232,145,46,.28);
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 0 26px rgba(255,178,74,.6), 0 14px 34px rgba(232,145,46,.4);
  }
  .btn-ghost{
    color:var(--bone);
    background:rgba(236,225,204,.03);
    border:1px solid rgba(236,225,204,.28);
  }
  .btn-ghost:hover{
    transform:translateY(-2px);
    border-color:rgba(255,178,74,.7);
    color:var(--flame-hot);
    background:rgba(232,145,46,.08);
  }
  .btn:focus-visible{outline:2px solid var(--ember-bright);outline-offset:3px;}

  /* ---- scroll cue ---- */
  .scrollcue{
    position:absolute;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    z-index:6;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    font-size:10px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--bone-dim);
    opacity:0;
    animation:rise 1s 1.6s ease forwards;
  }
  .scrollcue .line{
    width:1px;height:38px;
    background:linear-gradient(180deg,rgba(232,145,46,.7),transparent);
    animation:pulse 2.6s ease-in-out infinite;
  }

  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes widen{to{width:min(180px,42vw);}}
  @keyframes pulse{0%,100%{opacity:.3;transform:scaleY(.7);transform-origin:top;}50%{opacity:1;transform:scaleY(1);}}

  @media (max-width:560px){
    .brand span.full{display:none;}
    .dom{display:none;}
  }

  @media (prefers-reduced-motion:reduce){
    .mist,.scrollcue .line{animation:none;}
    .eyebrow,.mark,.wordmark,.rule,.sub,.lede,.cta,.scrollcue{animation:none;opacity:1;}
    .rule{width:min(180px,42vw);}
  }
</style>

<div class="stage" id="stage">
  <canvas id="fire"></canvas>

  <div class="mist mist-c"></div>
  <div class="mist mist-a"></div>
  <div class="mist mist-b"></div>

  <div class="vignette"></div>

  <header class="topbar">
    <div class="brand">
      <!-- Slavic warrior helmet mark -->
      <svg viewBox="0 0 120 150" fill="none" aria-hidden="true">
        <circle cx="60" cy="12" r="4.2" fill="#1b1410" stroke="#ece1cc" stroke-width="3"/>
        <path d="M60 16 C50 32,43 54,41 76 L79 76 C77 54,70 32,60 16 Z" stroke="#ece1cc" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M60 18 L60 76" stroke="#ece1cc" stroke-width="2.4"/>
        <path d="M50 24 C46 44,44 60,44 76" stroke="#ece1cc" stroke-width="2.2" opacity=".8"/>
        <path d="M70 24 C74 44,76 60,76 76" stroke="#ece1cc" stroke-width="2.2" opacity=".8"/>
        <path d="M35 76 L85 76 L85 87 L35 87 Z" fill="#1b1410" stroke="#ece1cc" stroke-width="3" stroke-linejoin="round"/>
        <path d="M45 87 Q52 96 60 88" stroke="#ece1cc" stroke-width="2.4" fill="none"/>
        <path d="M60 88 Q68 96 75 87" stroke="#ece1cc" stroke-width="2.4" fill="none"/>
        <path d="M56.5 88 L56.5 110 Q56.5 116 60 116 Q63.5 116 63.5 110 L63.5 88 Z" fill="#1b1410" stroke="#ece1cc" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <span class="full"><b>MĘSKI RÓD</b></span>
    </div>
    <div class="dom">meskirod.pl</div>
  </header>

  <main class="hero" id="hero">
    <div class="eyebrow">Wolin · Brzeg Bałtyku · Krąg Ognia</div>

    <div class="mark">
      <svg viewBox="0 0 120 150" fill="none" aria-label="Hełm słowiańskiego woja">
        <circle cx="60" cy="12" r="4.2" fill="#1b1410" stroke="#ece1cc" stroke-width="3"/>
        <path d="M60 16 C50 32,43 54,41 76 L79 76 C77 54,70 32,60 16 Z" stroke="#ece1cc" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M60 18 L60 76" stroke="#ece1cc" stroke-width="2.4"/>
        <path d="M50 24 C46 44,44 60,44 76" stroke="#ece1cc" stroke-width="2.2" opacity=".8"/>
        <path d="M70 24 C74 44,76 60,76 76" stroke="#ece1cc" stroke-width="2.2" opacity=".8"/>
        <path d="M35 76 L85 76 L85 87 L35 87 Z" fill="#1b1410" stroke="#ece1cc" stroke-width="3" stroke-linejoin="round"/>
        <path d="M45 87 Q52 96 60 88" stroke="#ece1cc" stroke-width="2.4" fill="none"/>
        <path d="M60 88 Q68 96 75 87" stroke="#ece1cc" stroke-width="2.4" fill="none"/>
        <path d="M56.5 88 L56.5 110 Q56.5 116 60 116 Q63.5 116 63.5 110 L63.5 88 Z" fill="#1b1410" stroke="#ece1cc" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="wordmark">Męski Ród</h1>
    <div class="rule"></div>
    <p class="sub">Centrum zdrowia psychicznego i braterskiego wsparcia mężczyzn</p>
    <p class="lede">Nie musisz dźwigać wszystkiego sam.</p>

    <div class="cta">
      <a class="btn btn-primary" href="#">Dołącz do kręgu</a>
      <a class="btn btn-ghost" href="#">Szukam pomocy</a>
    </div>
  </main>

  <div class="scrollcue">
    <span>Przewiń</span>
    <span class="line"></span>
  </div>
</div>

<script>
(function(){
  var canvas=document.getElementById('fire');
  var ctx=canvas.getContext('2d');
  var stage=document.getElementById('stage');
  var hero=document.getElementById('hero');
  var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  var embers=[],smoke=[];
  var baseX=0,baseY=0,baseW=0;
  var t=0;

  function resize(){
    W=stage.clientWidth; H=stage.clientHeight;
    canvas.width=W*DPR; canvas.height=H*DPR;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    baseX=W*0.5; baseY=H*0.88; baseW=Math.max(120,Math.min(W*0.22,340));
  }
  resize();
  window.addEventListener('resize',resize);

  function rand(a,b){return a+Math.random()*(b-a);}

  function spawnEmber(){
    var spread=baseW*0.5;
    return {
      x:baseX+rand(-spread,spread)*rand(.2,1),
      y:baseY+rand(-8,10),
      vx:rand(-.28,.28),
      vy:rand(-2.6,-1.1),
      life:0, max:rand(60,150),
      size:rand(1.1,3.2),
      sway:rand(0,6.28), swaySpeed:rand(.01,.05)
    };
  }
  function spawnSmoke(){
    return {
      x:baseX+rand(-baseW*.4,baseW*.4),
      y:baseY,
      vx:rand(-.15,.15),
      vy:rand(-.7,-.35),
      life:0, max:rand(120,220),
      size:rand(30,70)
    };
  }

  var maxEmbers=reduce?70:130;
  for(var i=0;i<maxEmbers;i++){var e=spawnEmber();e.life=rand(0,e.max);embers.push(e);}
  for(var s=0;s<18;s++){var sm=spawnSmoke();sm.life=rand(0,sm.max);smoke.push(sm);}

  function flicker(time){
    return 0.72
      +0.16*Math.sin(time*0.07)
      +0.08*Math.sin(time*0.19+1.3)
      +0.05*Math.sin(time*0.41+2.1);
  }

  function drawGlow(fl){
    var gx=baseX, gy=baseY;
    var r=baseW*rand(1.55,1.6);
    var g=ctx.createRadialGradient(gx,gy-baseW*0.35,0,gx,gy,r);
    g.addColorStop(0,'rgba(255,205,120,'+(0.42*fl)+')');
    g.addColorStop(0.22,'rgba(240,150,55,'+(0.30*fl)+')');
    g.addColorStop(0.55,'rgba(200,90,30,'+(0.13*fl)+')');
    g.addColorStop(1,'rgba(120,50,20,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(gx,gy,r,r*1.15,0,0,6.2832);
    ctx.fill();

    // hot core
    var c=ctx.createRadialGradient(gx,gy,0,gx,gy,baseW*0.6);
    c.addColorStop(0,'rgba(255,225,150,'+(0.5*fl)+')');
    c.addColorStop(1,'rgba(255,150,50,0)');
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.ellipse(gx,gy-baseW*0.1,baseW*0.5,baseW*0.75,0,0,6.2832);
    ctx.fill();
  }

  function drawEmber(e){
    var lifeT=1-e.life/e.max;          // 1 fresh -> 0 dead
    var alpha=Math.min(1,lifeT*1.6)*Math.min(1,(e.life<10?e.life/10:1));
    var r=255;
    var g=Math.round(90+150*lifeT);
    var b=Math.round(20+130*Math.max(0,lifeT-0.55)*2.2);
    var rad=e.size*(0.6+lifeT*0.8);
    var grd=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,rad*3.2);
    grd.addColorStop(0,'rgba('+r+','+g+','+b+','+alpha+')');
    grd.addColorStop(0.4,'rgba('+r+','+Math.round(g*0.7)+',30,'+(alpha*0.5)+')');
    grd.addColorStop(1,'rgba(120,40,10,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.arc(e.x,e.y,rad*3.2,0,6.2832);
    ctx.fill();
  }

  function drawSmoke(sm){
    var lifeT=sm.life/sm.max;
    var alpha=Math.sin(lifeT*Math.PI)*0.05;
    var rad=sm.size*(1+lifeT*1.6);
    var grd=ctx.createRadialGradient(sm.x,sm.y,0,sm.x,sm.y,rad);
    grd.addColorStop(0,'rgba(150,140,130,'+alpha+')');
    grd.addColorStop(1,'rgba(120,120,120,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.arc(sm.x,sm.y,rad,0,6.2832);
    ctx.fill();
  }

  function frame(){
    t++;
    ctx.clearRect(0,0,W,H);
    var fl=flicker(t);

    // smoke first (normal blend, subtle)
    ctx.globalCompositeOperation='source-over';
    for(var i=0;i<smoke.length;i++){
      var sm=smoke[i];
      sm.x+=sm.vx; sm.y+=sm.vy; sm.life++;
      if(sm.life>=sm.max){smoke[i]=spawnSmoke();continue;}
      drawSmoke(sm);
    }

    // additive fire
    ctx.globalCompositeOperation='lighter';
    drawGlow(fl);
    for(var j=0;j<embers.length;j++){
      var e=embers[j];
      e.sway+=e.swaySpeed;
      e.x+=e.vx+Math.sin(e.sway)*0.35;
      e.y+=e.vy;
      e.vy*=0.995;
      e.life++;
      if(e.life>=e.max||e.y<H*0.12){embers[j]=spawnEmber();continue;}
      drawEmber(e);
    }
    ctx.globalCompositeOperation='source-over';

    if(!reduce) requestAnimationFrame(frame);
  }

  if(reduce){
    // one static, composed frame
    ctx.globalCompositeOperation='source-over';
    for(var q=0;q<smoke.length;q++)drawSmoke(smoke[q]);
    ctx.globalCompositeOperation='lighter';
    drawGlow(1);
    for(var p=0;p<embers.length;p++)drawEmber(embers[p]);
    ctx.globalCompositeOperation='source-over';
  }else{
    requestAnimationFrame(frame);
  }

  // ---- parallax ----
  var tx=0,ty=0,cx=0,cy=0;
  function apply(){
    cx+=(tx-cx)*0.06; cy+=(ty-cy)*0.06;
    hero.style.transform='translate('+(cx*-14)+'px,'+(cy*-9)+'px)';
    canvas.style.transform='translate('+(cx*10)+'px,'+(cy*7)+'px)';
    var mists=document.querySelectorAll('.mist');
    mists[0].style.marginLeft=(cx*26)+'px';
    mists[1].style.marginLeft=(cx*-30)+'px';
    mists[2].style.marginLeft=(cx*18)+'px';
    requestAnimationFrame(apply);
  }
  if(!reduce){
    window.addEventListener('mousemove',function(ev){
      tx=(ev.clientX/window.innerWidth-0.5)*2;
      ty=(ev.clientY/window.innerHeight-0.5)*2;
    });
    requestAnimationFrame(apply);
  }
})();
</script>
